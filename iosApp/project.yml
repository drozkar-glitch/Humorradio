name: iosApp
options:
  bundleIdPrefix: cz.taximares
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_NAME: "RadioPM"
        PRODUCT_BUNDLE_IDENTIFIER: "cz.taximares.radiopm"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "51"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iosApp/Info.plist
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/bin/iosArm64/releaseFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
          - "-framework"
          - "ComposeApp"
