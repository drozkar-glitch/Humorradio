name: Build & Publish KMP (Android + iOS)

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "**.md"
      - "**.html"
  workflow_dispatch:

env:
  APP_NAME: "RadioPM"
  BUNDLE_ID: "cz.taximares.radiopm"
  APP_VERSION: "1.0"
  PUBLISH_TO_STORES: "true"
  BUILD_IOS: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-android:
    name: Android Release (.apk & .aab)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch Signing Keys from Private Vault (ios-keys)
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p iosApp/signing
          if [ -n "$VAULT_TOKEN" ]; then
            if curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${OWNER}/ios-keys/contents/android_keystore_${APP_NAME}.b64" -o "iosApp/signing/android_keystore.b64" && \
              curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${OWNER}/ios-keys/contents/android_keystore_${APP_NAME}.props" -o "iosApp/signing/android_keystore.props"; then
              echo "Nacten vlastni Android keystore pro projekt ${APP_NAME} z ios-keys."
            else
              for f in android_keystore.b64 android_keystore.props; do
                curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
                  "https://api.github.com/repos/${OWNER}/ios-keys/contents/${f}" -o "iosApp/signing/${f}" || rm -f "iosApp/signing/${f}"
              done
            fi
            curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${OWNER}/ios-keys/contents/gplaykey.json.b64" -o "iosApp/signing/gplaykey.json.b64" || rm -f "iosApp/signing/gplaykey.json.b64"
            for hf in huawei_key.json.b64 huaweikey.json.b64 agconnect_key.json.b64; do
              if curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/${OWNER}/ios-keys/contents/${hf}" -o "iosApp/signing/huawei_key.json.b64"; then
                break
              fi
            done
          fi

      - name: Prepare Gradle Wrapper and Build Number
        run: |
          BUILD_NUM=$(( ${GITHUB_RUN_NUMBER:-1} + 100 ))
          echo "PROJECT_BUILD_NUMBER=${BUILD_NUM}" >> $GITHUB_ENV
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p /tmp/gw_init
            echo 'rootProject.name = "init"' > /tmp/gw_init/settings.gradle.kts
            cd /tmp/gw_init
            gradle wrapper --gradle-version 8.7 --no-daemon
            cd - > /dev/null
            cp -f /tmp/gw_init/gradlew .
            cp -rf /tmp/gw_init/gradle .
          fi
          chmod +x gradlew

      - name: Prepare Android Signing Keystore
        run: |
          if [ -s "iosApp/signing/android_keystore.b64" ] && [ -s "iosApp/signing/android_keystore.props" ]; then
            base64 --decode < iosApp/signing/android_keystore.b64 > /tmp/android_keystore.jks
            echo "CM_KEYSTORE_PATH=/tmp/android_keystore.jks" >> $GITHUB_ENV
            while IFS='=' read -r key val; do
              key=$(echo "$key" | tr -d '\r\n ')
              val=$(echo "$val" | tr -d '\r\n')
              if [ -n "$key" ]; then
                export "${key}=${val}"
                echo "${key}=${val}" >> $GITHUB_ENV
              fi
            done < iosApp/signing/android_keystore.props
            DETECTED_ALIAS=$(keytool -J-Duser.language=en -list -v -keystore /tmp/android_keystore.jks -storepass "$CM_KEYSTORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -n 1 | tr -d '\r\n ')
            if [ -n "$DETECTED_ALIAS" ]; then
              echo "Automaticky rozpoznan skutecny alias v keystore: $DETECTED_ALIAS"
              echo "CM_KEY_ALIAS=$DETECTED_ALIAS" >> $GITHUB_ENV
            fi
            echo "Android keystore uspesne nacten."
          else
            echo "UPOZORNENI: Android keystore nebyl nalezen, build pobezi bez produkcniho podpisu."
          fi

      - name: Build Android Release AAB and APK
        run: |
          if [ -f "composeApp/build.gradle.kts" ]; then
            sed -i "s/versionName = \"[0-9.]*\\.\$ciBuildNumber\"/versionName = \"${APP_VERSION}.\$ciBuildNumber\"/g" composeApp/build.gradle.kts || true
            sed -i "s/versionName = \"[0-9.]*\\.\\\${ciBuildNumber}\"/versionName = \"${APP_VERSION}.\\\${ciBuildNumber}\"/g" composeApp/build.gradle.kts || true
          fi
          ./gradlew :composeApp:bundleRelease :composeApp:assembleRelease
          BUILD_NUM="${PROJECT_BUILD_NUMBER}"
          VERSION_NAME="${APP_VERSION}.${BUILD_NUM}"
          mv composeApp/build/outputs/apk/release/composeApp-release.apk "composeApp/build/outputs/apk/release/${APP_NAME}-${VERSION_NAME}.apk"
          mv composeApp/build/outputs/bundle/release/composeApp-release.aab "composeApp/build/outputs/bundle/release/${APP_NAME}-${VERSION_NAME}.aab"

      - name: Upload Android Artifacts (.apk & .aab)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Android-APK-AAB
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab

      - name: Publish Android AAB to Google Play (Internal Testing)
        run: |
          if [ "$PUBLISH_TO_STORES" != "true" ]; then
            echo "Publikace do obchodu je vypnuta (PUBLISH_TO_STORES=false). Preskakuji Google Play upload."
          elif [ -s "iosApp/signing/gplaykey.json.b64" ]; then
            echo "Nalezen Google Play klic, dekoduji a nahravam do Google Play (Interni testovani)..."
            base64 --decode < iosApp/signing/gplaykey.json.b64 > /tmp/gplay_key.json
            pip3 install --quiet --break-system-packages google-api-python-client google-auth-httplib2 google-auth-oauthlib || \
            pip3 install --quiet google-api-python-client google-auth-httplib2 google-auth-oauthlib

            python3 - << 'EOF'
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError

          package_name = os.environ.get("BUNDLE_ID")
          build_num = os.environ.get("PROJECT_BUILD_NUMBER", "101")
          app_name = os.environ.get("APP_NAME")
          app_version = os.environ.get("APP_VERSION", "1.0")
          aab_path = f"composeApp/build/outputs/bundle/release/{app_name}-{app_version}.{build_num}.aab"

          try:
              creds = service_account.Credentials.from_service_account_file(
                  "/tmp/gplay_key.json",
                  scopes=["https://www.googleapis.com/auth/androidpublisher"]
              )
              service = build("androidpublisher", "v3", credentials=creds)

              edit_request = service.edits().insert(body={}, packageName=package_name)
              result = edit_request.execute(num_retries=5)
              edit_id = result["id"]

              media = MediaFileUpload(aab_path, mimetype="application/octet-stream", resumable=True)
              bundle_response = service.edits().bundles().upload(
                  editId=edit_id,
                  packageName=package_name,
                  media_body=media
              ).execute(num_retries=5)
              version_code = bundle_response["versionCode"]
              print(f"AAB uspesne nahrano (versionCode: {version_code}).")

              def commit_edit(eid):
                  try:
                      service.edits().commit(editId=eid, packageName=package_name).execute(num_retries=5)
                      print("Publikace do Google Play (Interni testovani) uspesne dokoncena!")
                  except Exception as cerr:
                      err_str = str(cerr)
                      if "Only releases with status draft" in err_str:
                          raise cerr
                      print(f"Standardni commit vyzaduje rucni potvrzeni v konzoli ({cerr}), ukladam s changesNotSentForReview=True...")
                      service.edits().commit(
                          editId=eid,
                          packageName=package_name,
                          changesNotSentForReview=True
                      ).execute(num_retries=5)
                      print("Publikace ulozena do Google Play (changesNotSentForReview=True)! Staci ji potvrdit v Prehledu publikovani.")

              try:
                  service.edits().tracks().update(
                      editId=edit_id,
                      track="internal",
                      packageName=package_name,
                      body={"releases": [{"versionCodes": [str(version_code)], "status": "completed"}]}
                  ).execute(num_retries=5)
                  print("Prirazeno do kanalu internal (completed).")
                  commit_edit(edit_id)
              except Exception as track_err:
                  print(f"Aplikace je v Google Play v rezimu draft ({track_err}). Prepinam vydani v kanalu internal na status draft...")
                  service.edits().tracks().update(
                      editId=edit_id,
                      track="internal",
                      packageName=package_name,
                      body={"releases": [{"versionCodes": [str(version_code)], "status": "draft"}]}
                  ).execute(num_retries=5)
                  print("Prirazeno do kanalu internal jako draft.")
                  commit_edit(edit_id)
          except HttpError as e:
              if e.resp.status == 404:
                  print(f"UPOZORNENI: Balicek '{package_name}' zatim v Google Play Console neexistuje (404 Package not found).")
                  print("Prvni .aab soubor je nutne do Google Play Console nahrat rucne.")
              else:
                  print(f"UPOZORNENI: Chyba Google Play API ({e.resp.status}): {e}.")
          except Exception as e:
              print(f"UPOZORNENI: Neocekavana chyba pri nahravani do Google Play: {e}.")
          EOF
          else
            echo "Google Play klic nebyl nalezen, preskakuji Google Play upload."
          fi
      - name: Publish Android APK to Huawei AppGallery
        run: |
          if [ "$PUBLISH_TO_STORES" != "true" ]; then
            echo "Publikace do obchodu je vypnuta (PUBLISH_TO_STORES=false). Preskakuji Huawei AppGallery upload."
          elif [ -s "iosApp/signing/huawei_key.json.b64" ]; then
            echo "Nalezen Huawei Service Account klic, dekoduji a pripojuji se k Huawei AppGallery Connect..."
            base64 --decode < iosApp/signing/huawei_key.json.b64 > /tmp/huawei_key.json
            pip3 install --quiet --break-system-packages pyjwt cryptography requests || \
            pip3 install --quiet pyjwt cryptography requests

            python3 - << 'EOF'
          import os, sys, json, time, jwt, requests

          package_name = os.environ.get("BUNDLE_ID", "").strip()
          build_num = os.environ.get("PROJECT_BUILD_NUMBER", "101").strip()
          app_name = os.environ.get("APP_NAME", "").strip()
          app_version = os.environ.get("APP_VERSION", "1.0").strip()
          apk_path = f"composeApp/build/outputs/apk/release/{app_name}-{app_version}.{build_num}.apk"

          KNOWN_APP_IDS = {
              "cz.taximares.radiopm": "119618129",
              "cz.mares.radiopm": "119618129"
          }

          if not os.path.exists(apk_path):
              print(f"UPOZORNENI: APK soubor {apk_path} nebyl nalezen, preskakuji Huawei upload.")
              sys.exit(0)

          try:
              with open("/tmp/huawei_key.json", "r", encoding="utf-8") as f:
                  hk = json.load(f)
              key_id = str(hk.get("key_id", "")).strip()
              priv_key = str(hk.get("private_key", "")).strip()
              sub_account = str(hk.get("sub_account", "")).strip()
              token_uri = str(hk.get("token_uri", "https://connect-api.cloud.huawei.com/api/oauth2/v1/token")).strip()
              base_agc = "https://connect-api.cloud.huawei.com/api"

              now = int(time.time())
              candidates = []
              for alg in ["PS256", "RS256"]:
                  for aud_val in [
                      "https://connect-api.cloud.huawei.com/api/oauth2/v1/token",
                      token_uri,
                      "https://connect-api.cloud.huawei.com"
                  ]:
                      try:
                          pl = {"iss": sub_account, "aud": aud_val, "iat": now - 30, "exp": now + 3000}
                          tok = jwt.encode(pl, priv_key, algorithm=alg, headers={"kid": key_id, "typ": "JWT", "alg": alg})
                          if isinstance(tok, bytes):
                              tok = tok.decode("utf-8")
                          candidates.append((f"JWT-{alg} (aud={aud_val})", {
                              "Authorization": f"Bearer {tok}",
                              "client_id": sub_account,
                              "Content-Type": "application/json"
                          }))
                      except Exception as sign_err:
                          pass

              if "client_secret" in hk or "key" in hk:
                  c_sec = hk.get("client_secret") or hk.get("key")
                  c_id = hk.get("client_id") or sub_account
                  tr = requests.post(f"{base_agc}/oauth2/v1/token", json={"grant_type": "client_credentials", "client_id": c_id, "client_secret": c_sec}, timeout=30)
                  if tr.ok and tr.json().get("access_token"):
                      at = tr.json()["access_token"]
                      candidates.insert(0, ("OAuth-ClientCredentials", {
                          "Authorization": f"Bearer {at}",
                          "client_id": str(c_id),
                          "Content-Type": "application/json"
                      }))

              working_headers = None
              app_res = None
              last_err_detail = ""
              known_id = KNOWN_APP_IDS.get(package_name, "")

              for label, hdrs in candidates:
                  test_r = requests.get(f"{base_agc}/publish/v2/appid-list", params={"packageName": package_name}, headers=hdrs, timeout=30)
                  if test_r.ok:
                      working_headers = hdrs
                      app_res = test_r
                      print(f"Huawei autorizace uspesna ({label}).")
                      break
                  elif known_id:
                      test_r2 = requests.get(f"{base_agc}/publish/v2/app-info", params={"appId": known_id}, headers=hdrs, timeout=30)
                      if test_r2.ok:
                          working_headers = hdrs
                          app_res = test_r2
                          print(f"Huawei autorizace uspesna pres App ID {known_id} ({label}).")
                          break
                      else:
                          last_err_detail = f"{label} -> HTTP {test_r2.status_code}: {test_r2.text}"
                  else:
                      last_err_detail = f"{label} -> HTTP {test_r.status_code}: {test_r.text}"

              if not working_headers:
                  print(f"UPOZORNENI: Huawei AppGallery API odmitlo autorizaci. Posledni odpoved serveru: {last_err_detail}")
                  sys.exit(0)

              huawei_app_id = ""
              if app_res and app_res.ok:
                  app_ids = app_res.json().get("appids", [])
                  if app_ids:
                      huawei_app_id = str(app_ids[0].get("value", ""))

              if not huawei_app_id and known_id:
                  huawei_app_id = known_id
                  print(f"Balicek '{package_name}' v konzoli jeste nema prirazeny packageName (--), pouzivam zalozene App ID: {huawei_app_id}.")

              if not huawei_app_id:
                  print(f"UPOZORNENI: Balicek '{package_name}' zatim v Huawei AppGallery Connect neexistuje.")
                  sys.exit(0)

              print(f"Pripravuji nahrani {os.path.basename(apk_path)} do Huawei App ID: {huawei_app_id}...")
              url_res = requests.get(
                  f"{base_agc}/publish/v2/upload-url/for-obs",
                  params={"appId": huawei_app_id, "fileName": os.path.basename(apk_path), "contentLength": os.path.getsize(apk_path)},
                  headers=working_headers,
                  timeout=30
              )
              if url_res.ok and url_res.json().get("urlInfo"):
                  url_info = url_res.json()["urlInfo"]
                  upload_url = url_info.get("url")
                  upload_headers = dict(url_info.get("headers", {}))
                  with open(apk_path, "rb") as apk_f:
                      up_r = requests.put(upload_url, data=apk_f, headers=upload_headers, timeout=300)
                  if up_r.ok:
                      file_info_body = {
                          "fileType": 5,
                          "files": [{"fileName": os.path.basename(apk_path), "fileDestUrl": url_info.get("objectId", "")}]
                      }
                      fi_r = requests.put(f"{base_agc}/publish/v2/app-file-info", params={"appId": huawei_app_id}, json=file_info_body, headers=working_headers, timeout=60)
                      if fi_r.ok and str(fi_r.json().get("ret", {}).get("code", "")) == "0":
                          print(f"APK {os.path.basename(apk_path)} uspesne nahrano a prirazeno do Huawei AppGallery Connect (App ID {huawei_app_id})!")
                      else:
                          print(f"Odpoved Huawei pri prirazeni APK (app-file-info): {fi_r.status_code} {fi_r.text}")
                  else:
                      print(f"Upozorneni pri nahravani souboru na Huawei OBS: {up_r.status_code} {up_r.text}")
              else:
                  print(f"Odpoved upload-url/for-obs ({url_res.status_code}: {url_res.text}), zkousim standardni upload-url...")
                  u2_res = requests.get(f"{base_agc}/publish/v2/upload-url", params={"appId": huawei_app_id, "suffix": "apk"}, headers=working_headers, timeout=30)
                  if u2_res.ok and u2_res.json().get("uploadUrl"):
                      u2_data = u2_res.json()
                      with open(apk_path, "rb") as apk_f:
                          up2_r = requests.post(
                              u2_data["uploadUrl"],
                              files={"file": (os.path.basename(apk_path), apk_f, "application/octet-stream")},
                              data={"authCode": u2_data.get("authCode", ""), "fileCount": "1"},
                              timeout=300
                          )
                      if up2_r.ok:
                          flist = up2_r.json().get("result", {}).get("UploadFileRsp", {}).get("fileInfoList", [])
                          if flist:
                              dest_url = flist[0].get("fileDestUlr") or flist[0].get("fileDestUrl")
                              fi_body = {"fileType": 5, "files": [{"fileName": os.path.basename(apk_path), "fileDestUrl": dest_url}]}
                              fi2_r = requests.put(f"{base_agc}/publish/v2/app-file-info", params={"appId": huawei_app_id}, json=fi_body, headers=working_headers, timeout=60)
                              print(f"APK nahrano pres upload-url do Huawei AppGallery ({fi2_r.status_code}): {fi2_r.text}")
                          else:
                              print(f"Odpoved po uploadu: {up2_r.text}")
                      else:
                          print(f"Chyba pri POST uploadu APK: {up2_r.status_code} {up2_r.text}")
                  else:
                      print(f"Nelze ziskat upload URL z Huawei AppGallery: {u2_res.status_code} {u2_res.text}")
          except Exception as e:
              print(f"UPOZORNENI: Chyba pri komunikaci s Huawei AppGallery API: {e}")
          EOF
          else
            echo "Huawei klic nebyl nalezen, preskakuji Huawei AppGallery upload."
          fi
  build-ios:
    name: iOS Release (.ipa & TestFlight)
    runs-on: macos-latest
    if: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch Signing Keys from Private Vault (ios-keys)
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p iosApp/signing
          if [ -n "$VAULT_TOKEN" ]; then
            for f in ioskey.p12.b64 ioskey.pwd apple_api_key.p8.b64 apple_api_key.props; do
              curl -sfL -H "Authorization: Bearer $VAULT_TOKEN" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/${OWNER}/ios-keys/contents/${f}" -o "iosApp/signing/${f}" || rm -f "iosApp/signing/${f}"
            done
          fi

      - name: Build KMP iOS Framework, Sign and Package IPA
        run: |
          if [ "$BUILD_IOS" != "true" ]; then
            echo "iOS build je vypnuty (rezim Pouze Android). Preskakuji."
            exit 0
          fi
          export PATH="$HOME/Library/Python/3.9/bin:$HOME/Library/Python/3.11/bin:$HOME/Library/Python/3.12/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          BUILD_NUM=$(( ${GITHUB_RUN_NUMBER:-1} + 100 ))
          export PROJECT_BUILD_NUMBER="${BUILD_NUM}"

          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p /tmp/gw_init
            echo 'rootProject.name = "init"' > /tmp/gw_init/settings.gradle.kts
            cd /tmp/gw_init
            gradle wrapper --gradle-version 8.7 --no-daemon
            cd - > /dev/null
            cp -f /tmp/gw_init/gradlew .
            cp -rf /tmp/gw_init/gradle .
          fi
          chmod +x gradlew

          ./gradlew :composeApp:linkReleaseFrameworkIosArm64

          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi

          FW_PATH="$(pwd)/composeApp/build/bin/iosArm64/releaseFramework"
          cat << EOF > iosApp/project.yml
          name: iosApp
          options:
            xcodeVersion: "15.0"
            bundleIdPrefix: cz.mares
            deploymentTarget:
              iOS: "15.0"
          targets:
            iosApp:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: iosApp
                  excludes:
                    - "signing/**"
                    - "Info.plist"
                    - "*.entitlements"
              settings:
                base:
                  SWIFT_VERSION: "5.0"
                  PRODUCT_NAME: "${APP_NAME}"
                  PRODUCT_BUNDLE_IDENTIFIER: "${BUNDLE_ID}"
                  MARKETING_VERSION: "${APP_VERSION}"
                  CURRENT_PROJECT_VERSION: "${BUILD_NUM}"
                  SDKROOT: iphoneos
                  TARGETED_DEVICE_FAMILY: "1,2"
                  IPHONEOS_DEPLOYMENT_TARGET: "15.0"
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_FILE: iosApp/Info.plist
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  ENABLE_USER_SCRIPT_SANDBOXING: NO
                  SWIFT_ENABLE_EXPLICIT_MODULES: NO
                  FRAMEWORK_SEARCH_PATHS:
                    - "\$(inherited)"
                    - "${FW_PATH}"
                  OTHER_LDFLAGS:
                    - "\$(inherited)"
                    - "-ObjC"
                    - "-framework"
                    - "ComposeApp"
                    - "-lsqlite3"
                  ENABLE_BITCODE: NO
          schemes:
            iosApp:
              build:
                targets:
                  iosApp: all
          EOF

          cd iosApp
          xcodegen generate
          sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/g' iosApp.xcodeproj/project.pbxproj
          cd ..

          if [ ! -s "iosApp/signing/ioskey.p12.b64" ] || [ ! -s "iosApp/signing/apple_api_key.p8.b64" ]; then
            echo "Chybi iOS certifikat (.p12) nebo Apple API klic (.p8) v trezoru ios-keys! Nahraj je do ios-keys pres StavitelAplikaci.html."
            exit 1
          fi

          pip3 install --quiet --break-system-packages codemagic-cli-tools || \
          pip3 install --quiet codemagic-cli-tools

          base64 --decode < iosApp/signing/ioskey.p12.b64 > /tmp/certificate.p12
          CERT_PWD=$(cat iosApp/signing/ioskey.pwd | tr -d '\r\n')

          base64 --decode < iosApp/signing/apple_api_key.p8.b64 > /tmp/AuthKey.p8
          while IFS='=' read -r key val; do
            key=$(echo "$key" | tr -d '\r\n ')
            val=$(echo "$val" | tr -d '\r\n')
            if [ -n "$key" ]; then
              export "${key}=${val}"
            fi
          done < iosApp/signing/apple_api_key.props

          openssl pkcs12 -in /tmp/certificate.p12 -nocerts -nodes -passin pass:"$CERT_PWD" -out /tmp/cert_key_raw.pem || \
          openssl pkcs12 -legacy -in /tmp/certificate.p12 -nocerts -nodes -passin pass:"$CERT_PWD" -out /tmp/cert_key_raw.pem
          openssl pkey -in /tmp/cert_key_raw.pem -out /tmp/cert_key.pem

          keychain initialize

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "@file:/tmp/AuthKey.p8" \
            --create

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          for prof in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/*.mobileprovision; do
            if [ -f "$prof" ]; then
              cp -f "$prof" "$HOME/Library/MobileDevice/Provisioning Profiles/"
              UUID=$(security cms -D -i "$prof" | plutil -extract UUID raw - 2>/dev/null || true)
              if [ -n "$UUID" ]; then
                cp -f "$prof" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
                cp -f "$prof" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${UUID}.mobileprovision"
              fi
            fi
          done

          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password "$CERT_PWD"

          xcode-project use-profiles --project "iosApp/iosApp.xcodeproj"

          mkdir -p build/ios/xcarchive build/ios/ipa
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/xcarchive/iosApp.xcarchive \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO

          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/iosApp.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$HOME/export_options.plist"

          if [ "$PUBLISH_TO_STORES" = "true" ]; then
            MAX_PUB_ATTEMPTS=5
            PUB_ATTEMPT=1
            APP_NOT_IN_ASC=0
            while [ $PUB_ATTEMPT -le $MAX_PUB_ATTEMPTS ]; do
              echo "Pokus $PUB_ATTEMPT/$MAX_PUB_ATTEMPTS: Nahravam .ipa (verze $APP_VERSION) do Apple App Store Connect (TestFlight)..."
              set +e
              app-store-connect publish \
                --path build/ios/ipa/*.ipa \
                --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
                --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
                --private-key "@file:/tmp/AuthKey.p8" 2>&1 | tee /tmp/asc_publish.log
              PUB_EXIT=${PIPESTATUS[0]}
              set -e

              if [ $PUB_EXIT -eq 0 ]; then
                echo "Upload .ipa (verze $APP_VERSION) uspesne dokoncen!"
                break
              fi

              if grep -qE "Cannot determine the Apple ID from Bundle ID|No suitable application records were found" /tmp/asc_publish.log; then
                echo "UPOZORNENI: Aplikace s Bundle ID '$BUNDLE_ID' zatim neni v App Store Connect zalozena."
                echo "Zaloz v App Store Connect novou aplikaci (Apps -> + -> New App) s Bundle ID '$BUNDLE_ID' a spust build znovu."
                APP_NOT_IN_ASC=1
                break
              fi

              if grep -qE "90062|90186|closed for new build submissions|must contain a higher version" /tmp/asc_publish.log; then
                if [ $PUB_ATTEMPT -eq $MAX_PUB_ATTEMPTS ]; then
                  echo "Nepodarilo se najit volnou verzi ani po $MAX_PUB_ATTEMPTS pokusech."
                  exit 1
                fi
                NEW_VER=$(python3 - << 'PYEOF'
          import re, os
          log_txt = open("/tmp/asc_publish.log", "r", errors="ignore").read()
          cur = os.environ.get("APP_VERSION", "1.0").strip()
          matches = re.findall(r"previously approved version \[([0-9.]+)\]|train version '([0-9.]+)'", log_txt)
          base = cur
          for g1, g2 in matches:
              v = g1 or g2
              if v:
                  base = v
          def parse_v(s):
              parts = [int(x) for x in s.split(".") if x.isdigit()]
              while len(parts) < 2:
                  parts.append(0)
              return parts
          p_cur = parse_v(cur)
          p_base = parse_v(base)
          target = list(p_base if p_base >= p_cur else p_cur)
          target[-1] += 1
          print(".".join(str(x) for x in target))
          PYEOF
                )
                NEW_VER=$(echo "$NEW_VER" | tr -d '\r\n ')
                echo "Verze $APP_VERSION je v App Store uzavrena (90062/90186). Automaticky zvysuji verzi na $NEW_VER a prebaluji .ipa..."
                export APP_VERSION="$NEW_VER"
                echo "APP_VERSION=$NEW_VER" >> $GITHUB_ENV

                plutil -replace ApplicationProperties.CFBundleShortVersionString -string "$NEW_VER" build/ios/xcarchive/iosApp.xcarchive/Info.plist || true
                for app_plist in build/ios/xcarchive/iosApp.xcarchive/Products/Applications/*.app/Info.plist; do
                  if [ -f "$app_plist" ]; then
                    plutil -replace CFBundleShortVersionString -string "$NEW_VER" "$app_plist" || true
                  fi
                done

                rm -rf build/ios/ipa/*.ipa
                xcodebuild -exportArchive \
                  -archivePath build/ios/xcarchive/iosApp.xcarchive \
                  -exportPath build/ios/ipa \
                  -exportOptionsPlist "$HOME/export_options.plist"

                PUB_ATTEMPT=$((PUB_ATTEMPT + 1))
              else
                echo "Chyba pri nahravani .ipa do App Store Connect (kod $PUB_EXIT)."
                exit $PUB_EXIT
              fi
            done
          else
            echo "Publikace do obchodu je vypnuta (PUBLISH_TO_STORES=false). Preskakuji TestFlight upload."
          fi

      - name: Upload iOS Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-iOS-IPA
          path: build/ios/ipa/*.ipa
